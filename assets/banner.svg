<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .pulsing-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .pulsing-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .flow-path {
        stroke-dasharray: 8 12;
        animation: dashFlow 20s linear infinite;
      }
      .flow-path-reverse {
        stroke-dasharray: 6 10;
        animation: dashFlowRev 16s linear infinite;
      }
      .floating-pill-1 {
        animation: floatA 6s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatB 7s ease-in-out infinite;
      }
      .floating-pill-3 {
        animation: floatA 8s ease-in-out infinite 1s;
      }
      .floating-pill-4 {
        animation: floatB 6.5s ease-in-out infinite 1.5s;
      }

      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.35) translate(40px, 20px); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.2) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(0.9) translate(-30px, -25px); opacity: 0.55; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -400; }
      }
      @keyframes dashFlowRev {
        to { stroke-dashoffset: 400; }
      }
      @keyframes floatA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.02em;
        fill: #f8fafc;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 0.01em;
        fill: #cbd5e1;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Ambience Orbs (Behind) -->
  <g opacity="0.6">
    <circle cx="180" cy="100" r="140" fill="#0284c7" filter="url(#glow)" class="pulsing-orb-1" />
    <circle cx="1020" cy="270" r="160" fill="#7c3aed" filter="url(#glow)" class="pulsing-orb-2" />
    <circle cx="850" cy="80" r="100" fill="#06b6d4" filter="url(#glow)" class="pulsing-orb-1" />
  </g>

  <!-- Dynamic Content Localization Flows / Data Pipelines (Behind Main Card) -->
  <g opacity="0.45" fill="none">
    <path d="M 60,80 C 260,180 340,30 560,90 C 780,150 920,40 1140,110" stroke="url(#primaryGrad)" stroke-width="2.5" class="flow-path" />
    <path d="M 60,300 C 300,220 440,340 700,280 C 900,230 1020,330 1140,290" stroke="url(#accentGrad)" stroke-width="2" class="flow-path-reverse" />
    <path d="M 120,40 C 220,160 300,260 540,240 C 720,220 860,140 1080,70" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" class="flow-path" />
  </g>

  <!-- Floating Pills - Positioned Strategically on Sides (Never obscuring Title) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(60, 42)">
    <rect width="165" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="82" y="21" text-anchor="middle" class="pill-text">🌍 50+ Languages</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-2" transform="translate(75, 298)">
    <rect width="180" height="34" rx="17" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="90" y="21" text-anchor="middle" class="pill-text">📱 30+ Social Channels</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-3" transform="translate(960, 48)">
    <rect width="175" height="34" rx="17" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="87" y="21" text-anchor="middle" class="pill-text">🤖 AI-Native Translators</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-4" transform="translate(950, 295)">
    <rect width="185" height="34" rx="17" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="92" y="21" text-anchor="middle" class="pill-text">⚡ Multi-Platform Sync</text>
  </g>

  <!-- Central Foreground Hero Card (High Contrast Backdrop to guarantee Title & Subtitle visibility) -->
  <g transform="translate(180, 75)" filter="url(#cardShadow)">
    <!-- Opaque frosted plate -->
    <rect width="840" height="220" rx="16" fill="#0b1120" fill-opacity="0.94" stroke="#334155" stroke-width="1.5" />
    <!-- Gradient accent border strip at top -->
    <rect width="840" height="3" rx="1.5" fill="url(#primaryGrad)" />

    <!-- Category Pill Tag -->
    <g transform="translate(420, 28)">
      <rect x="-115" y="0" width="230" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="17" text-anchor="middle" class="tag-text">✨ CURATED AWESOME STACK</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="420" y="102" text-anchor="middle" class="text-title">
      Awesome Multi-Channel Social Content Localization
    </text>

    <!-- Subtitle (Strictly Foreground) -->
    <text x="420" y="136" text-anchor="middle" class="text-sub">
      Curated Stack of SaaS Platforms &amp; Open-Source Engines for Cross-Platform Publishing
    </text>
    <text x="420" y="160" text-anchor="middle" class="text-sub" fill="#94a3b8">
      Cultural Adaptation • Real-Time Schedulers • Translation Memory • AI Orchestration
    </text>

    <!-- Bottom Feature Badges Inside Card -->
    <g transform="translate(420, 192)">
      <circle cx="-160" cy="-4" r="3" fill="#38bdf8" />
      <text x="-148" y="0" fill="#94a3b8" font-size="12" font-family="sans-serif">SaaS Category Leaders</text>
      
      <circle cx="-10" cy="-4" r="3" fill="#a855f7" />
      <text x="2" y="0" fill="#94a3b8" font-size="12" font-family="sans-serif">Self-Hosted Open Source</text>
      
      <circle cx="160" cy="-4" r="3" fill="#34d399" />
      <text x="172" y="0" fill="#94a3b8" font-size="12" font-family="sans-serif">Agentic Workflows &amp; MCP</text>
    </g>
  </g>

  <!-- Modern Corner Accents -->
  <path d="M 12 40 L 12 16 Q 12 12 16 12 L 40 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 1188 40 L 1188 16 Q 1188 12 1184 12 L 1160 12" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 12 340 L 12 364 Q 12 368 16 368 L 40 368" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 1188 340 L 1188 364 Q 1188 368 1184 368 L 1160 368" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />
</svg>
