<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080c14"/><stop offset="45%" stop-color="#0e172a"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".6" stdDeviation="16"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse1{0%{transform:scale(1) translate(0,0);opacity:.35}}@keyframes pulse2{0%{transform:scale(1.2) translate(0,0);opacity:.3}}@keyframes floatA{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatB{0%{transform:translateY(0)}50%{transform:translateY(7px)}}.pulsing-orb-1{animation:pulse1 8s ease-in-out infinite alternate}.pulsing-orb-2{animation:pulse2 10s ease-in-out infinite alternate}.flow-path{stroke-dasharray:8 12;animation:dashFlow 20s linear infinite}.flow-path-reverse{stroke-dasharray:6 10;animation:dashFlowRev 16s linear infinite}.floating-pill-1{animation:floatA 6s ease-in-out infinite}.floating-pill-2{animation:floatB 7s ease-in-out infinite}.floating-pill-3{animation:floatA 8s ease-in-out infinite 1s}.floating-pill-4{animation:floatB 6.5s ease-in-out infinite 1.5s}.text-title{font-weight:800;font-size:34px;letter-spacing:-.02em;fill:#f8fafc}.pill-text,.tag-text,.text-sub,.text-title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.text-sub{font-weight:400;font-size:15px;letter-spacing:.01em;fill:#cbd5e1}.pill-text{font-weight:600;font-size:12px;fill:#e2e8f0}.tag-text{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:#38bdf8}</style></defs><rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="380" fill="url(#grid)" rx="16"/><g opacity=".6"><circle cx="180" cy="100" r="140" fill="#0284c7" class="pulsing-orb-1" filter="url(#glow)"/><circle cx="1020" cy="270" r="160" fill="#7c3aed" class="pulsing-orb-2" filter="url(#glow)"/><circle cx="850" cy="80" r="100" fill="#06b6d4" class="pulsing-orb-1" filter="url(#glow)"/></g><g fill="none" opacity=".45"><path stroke="url(#primaryGrad)" stroke-width="2.5" d="M 60,80 C 260,180 340,30 560,90 C 780,150 920,40 1140,110" class="flow-path"/><path stroke="url(#accentGrad)" stroke-width="2" d="M 60,300 C 300,220 440,340 700,280 C 900,230 1020,330 1140,290" class="flow-path-reverse"/><path stroke="#818cf8" stroke-opacity=".3" stroke-width="1.5" d="M 120,40 C 220,160 300,260 540,240 C 720,220 860,140 1080,70" class="flow-path"/></g><g class="floating-pill-1" transform="translate(60, 42)"><rect width="165" height="34" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" filter="url(#softGlow)" rx="17"/><text x="82" y="21" class="pill-text" text-anchor="middle">🌍 50+ Languages</text></g><g class="floating-pill-2" transform="translate(75, 298)"><rect width="180" height="34" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity=".6" stroke-width="1.2" filter="url(#softGlow)" rx="17"/><text x="90" y="21" class="pill-text" text-anchor="middle">📱 30+ Social Channels</text></g><g class="floating-pill-3" transform="translate(960, 48)"><rect width="175" height="34" fill="url(#pillGrad)" stroke="#c084fc" stroke-opacity=".6" stroke-width="1.2" filter="url(#softGlow)" rx="17"/><text x="87" y="21" class="pill-text" text-anchor="middle">🤖 AI-Native Translators</text></g><g class="floating-pill-4" transform="translate(950, 295)"><rect width="185" height="34" fill="url(#pillGrad)" stroke="#06b6d4" stroke-opacity=".6" stroke-width="1.2" filter="url(#softGlow)" rx="17"/><text x="92" y="21" class="pill-text" text-anchor="middle">⚡ Multi-Platform Sync</text></g><g filter="url(#cardShadow)" transform="translate(180, 75)"><rect width="840" height="220" fill="#0b1120" fill-opacity=".94" stroke="#334155" stroke-width="1.5" rx="16"/><rect width="840" height="3" fill="url(#primaryGrad)" rx="1.5"/><g transform="translate(420, 28)"><rect width="230" height="26" x="-115" y="0" fill="#0369a1" fill-opacity=".25" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1" rx="13"/><text x="0" y="17" class="tag-text" text-anchor="middle">✨ CURATED AWESOME STACK</text></g><text x="420" y="102" class="text-title" text-anchor="middle">Awesome Multi-Channel Social Content Localization</text><text x="420" y="136" class="text-sub" text-anchor="middle">Curated Stack of SaaS Platforms &amp; Open-Source Engines for Cross-Platform Publishing</text><text x="420" y="160" fill="#94a3b8" class="text-sub" text-anchor="middle">Cultural Adaptation • Real-Time Schedulers • Translation Memory • AI Orchestration</text><g transform="translate(420, 192)"><circle cx="-160" cy="-4" r="3" fill="#38bdf8"/><text x="-148" y="0" fill="#94a3b8" font-family="sans-serif" font-size="12">SaaS Category Leaders</text><circle cx="-10" cy="-4" r="3" fill="#a855f7"/><text x="2" y="0" fill="#94a3b8" font-family="sans-serif" font-size="12">Self-Hosted Open Source</text><circle cx="160" cy="-4" r="3" fill="#34d399"/><text x="172" y="0" fill="#94a3b8" font-family="sans-serif" font-size="12">Agentic Workflows &amp; MCP</text></g></g><path fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="2" d="M 12 40 L 12 16 Q 12 12 16 12 L 40 12"/><path fill="none" stroke="#c084fc" stroke-opacity=".6" stroke-width="2" d="M 1188 40 L 1188 16 Q 1188 12 1184 12 L 1160 12"/><path fill="none" stroke="#06b6d4" stroke-opacity=".6" stroke-width="2" d="M 12 340 L 12 364 Q 12 368 16 368 L 40 368"/><path fill="none" stroke="#818cf8" stroke-opacity=".6" stroke-width="2" d="M 1188 340 L 1188 364 Q 1188 368 1184 368 L 1160 368"/></svg>